name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: builderwars_test
          POSTGRES_USER: builderwars
          POSTGRES_PASSWORD: builderwars-ci # throwaway CI container
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U builderwars -d builderwars_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      # Runs the repository-backed tests against PostgreSQL as well as in memory.
      TEST_DATABASE_URL: postgresql://builderwars:builderwars-ci@localhost:5432/builderwars_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Generated contracts are up to date
        run: uv run python scripts/export_contracts.py --check
      - name: Tests
        run: uv run pytest

  host-python310:
    # The host runtime and the shared protocol must run on CPython 3.10 (decision #1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ./packages/device_protocol ./device pytest
      - name: Protocol + host runtime tests on 3.10
        run: python -m pytest -p no:cacheprovider packages/device_protocol/tests device/tests
      - name: Simulator smoke run
        run: python -m board_runtime.simulator --count 3

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types match contracts/api/openapi.json
        run: npm run check:api
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Lambda assets are bundled from uv.lock at synth time (lambda_bundle.py, ADR 0006).
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: pip install -r requirements.txt
      - name: Synthesize and bundle Lambda assets (no deploy, no AWS credentials)
        run: python app.py && CDK_CONTEXT_JSON='{"env":"prod"}' python app.py
      - name: Synth assertions
        run: python -m pytest -q tests
