[project]
name = "bw-api"
version = "0.1.0"
description = "FastAPI application"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "bw-ai-platform",
    "bw-application",
    "bw-aws-adapters",
    "bw-domain",
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
bw-ai-platform = { workspace = true }
bw-application = { workspace = true }
bw-aws-adapters = { workspace = true }
bw-domain = { workspace = true }
