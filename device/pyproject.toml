[project]
name = "bw-board-runtime"
version = "0.1.0"
description = "Python runtime for the development board, plus a local simulator"
requires-python = ">=3.12"
dependencies = [
    "bw-device-protocol",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/board_runtime"]

[tool.uv.sources]
bw-device-protocol = { workspace = true }
