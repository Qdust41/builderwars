[project]
name = "bw-ai-platform"
version = "0.1.0"
description = "Controlled AI tool boundary (interfaces and stubs only)"
requires-python = ">=3.12"
dependencies = [
    "bw-domain",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_platform"]

[tool.uv.sources]
bw-domain = { workspace = true }
