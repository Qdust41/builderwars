[project]
name = "bw-application"
version = "0.1.0"
description = "Application services and ports (no AWS SDK imports)"
requires-python = ">=3.12"
dependencies = [
    "bw-domain",
    "bw-device-protocol",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/application"]

[tool.uv.sources]
bw-domain = { workspace = true }
bw-device-protocol = { workspace = true }
