[project]
name = "bw-aws-adapters"
version = "0.1.0"
description = "AWS adapters for the application ports (S3, SQS, IoT data plane, AppSync Events)"
requires-python = ">=3.12"
dependencies = [
    "bw-application",
    "bw-device-protocol",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_adapters"]

[tool.uv.sources]
bw-application = { workspace = true }
bw-device-protocol = { workspace = true }
