[project]
name = "bw-device-protocol"
version = "0.1.0"
description = "Versioned device<->cloud message contracts shared by the board runtime and the cloud"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/device_protocol"]
