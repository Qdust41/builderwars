[project]
name = "builderwars"
version = "0.1.0"
description = "Cloud-connected hardware collaboration platform (workspace root)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bw-device-protocol",
    "bw-domain",
    "bw-application",
    "bw-ai-platform",
    "bw-api",
    "bw-workers",
    "bw-board-runtime",
    "freewili>=0.0.51",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# The root is a virtual project: it only ties the workspace members together.
package = false

[tool.uv.workspace]
members = [
    "packages/device_protocol",
    "packages/domain",
    "packages/application",
    "packages/ai",
    "apps/api",
    "apps/workers",
    "device",
]

[tool.uv.sources]
bw-device-protocol = { workspace = true }
bw-domain = { workspace = true }
bw-application = { workspace = true }
bw-ai-platform = { workspace = true }
bw-api = { workspace = true }
bw-workers = { workspace = true }
bw-board-runtime = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/device_protocol/tests", "device/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "contract: device/API/realtime contract tests",
    "integration: tests that wire several packages together (no AWS)",
    "end_to_end: local end-to-end flows (no AWS)",
    "postgres: runs against PostgreSQL (skipped unless TEST_DATABASE_URL is set)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "infrastructure/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"infrastructure/tests/**" = ["S"]
"*/tests/**" = ["S", "PT011"]
"device/tests/**" = ["S", "PT011"]
# The protocol and host runtime must run on Python 3.10 (decision #1).
"packages/device_protocol/**" = ["UP017", "UP036", "UP042"]
"device/**" = ["UP017", "UP036", "UP042"]

[tool.ruff.lint.isort]
known-first-party = [
    "api", "workers", "domain", "application", "device_protocol", "ai_platform",
    "board_runtime", "stacks",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/device_protocol/src",
    "packages/domain/src",
    "packages/application/src",
    "packages/ai/src",
    "apps/api/src",
    "apps/workers/src",
    "device/src",
]
explicit_package_bases = true
files = [
    "packages/device_protocol/src",
    "packages/domain/src",
    "packages/application/src",
    "packages/ai/src",
    "apps/api/src",
    "apps/workers/src",
    "device/src",
]

[[tool.mypy.overrides]]
module = ["mangum.*", "awsiot.*", "awscrt.*", "freewili.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
